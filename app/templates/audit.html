{% extends "base.html" %}
{% block content %}
<h2>Audit Trail</h2>
<div class="card">
  <table>
    <tr><th>At</th><th>User</th><th>Action</th><th>Entity</th><th>Metadata</th></tr>
    {% for log in logs %}
      <tr><td>{{log.created_at}}</td><td>{{log.user.full_name}}</td><td>{{log.action}}</td><td>{{log.entity}}</td><td>{{log.metadata}}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
