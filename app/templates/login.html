<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title></head>
<body style="font-family:Arial;background:#f7f8fb;">
  <div style="max-width:420px;margin:80px auto;background:#fff;padding:24px;border-radius:10px;">
    <h2>Legal & Finance SaaS Login</h2>
    <form method="post">
      <label>Email</label>
      <input name="email" type="email" required style="width:100%;padding:8px;" />
      <label>Password</label>
      <input name="password" type="password" required style="width:100%;padding:8px;" />
      <button type="submit" style="margin-top:10px;padding:8px 14px;">Login</button>
    </form>
    <p>Seed once at <code>/bootstrap</code> then login with <code>owner@example.com</code>/<code>ChangeMe123!</code></p>
  </div>
</body>
</html>
