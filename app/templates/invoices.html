{% extends "base.html" %}
{% block content %}
<h2>Invoice & Tax Billing</h2>
<div class="grid">
  <div class="card">
    <h3>Create Invoice</h3>
    <form method="post">
      <input name="customer_name" placeholder="Customer name" required>
      <input name="amount_subtotal" type="number" step="0.01" placeholder="Subtotal" required>
      <input name="tax_percent" type="number" step="0.01" placeholder="Tax % (GST/PST/HST)" required>
      <input name="issued_on" type="date" required>
      <select name="status"><option>draft</option><option>sent</option><option>paid</option></select>
      <button type="submit">Save Invoice</button>
    </form>
  </div>
  <div class="card">
    <h3>Invoice List</h3>
    <table>
      <tr><th>Date</th><th>Customer</th><th>Subtotal</th><th>Tax</th><th>Total</th><th>Status</th></tr>
      {% for i in invoices %}
        <tr><td>{{i.issued_on}}</td><td>{{i.customer_name}}</td><td>{{i.amount_subtotal}}</td><td>{{i.tax_amount}}</td><td>{{i.amount_total}}</td><td>{{i.status}}</td></tr>
      {% endfor %}
    </table>
  </div>
</div>
{% endblock %}
