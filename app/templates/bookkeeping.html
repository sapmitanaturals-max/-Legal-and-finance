{% extends "base.html" %}
{% block content %}
<h2>Bookkeeping</h2>
<div class="grid">
  <div class="card">
    <h3>Post Entry</h3>
    <form method="post">
      <select name="entry_type"><option>income</option><option>expense</option><option>adjustment</option></select>
      <input name="category" placeholder="Category" required>
      <input name="description" placeholder="Description" required>
      <input name="amount" placeholder="Amount" type="number" step="0.01" required>
      <input name="posted_on" type="date" required>
      <button type="submit">Post</button>
    </form>
  </div>
  <div class="card">
    <h3>Entries</h3>
    <table>
      <tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th></tr>
      {% for e in entries %}<tr><td>{{e.posted_on}}</td><td>{{e.entry_type}}</td><td>{{e.category}}</td><td>{{e.amount}}</td></tr>{% endfor %}
    </table>
  </div>
</div>
{% endblock %}
